locale: "en-US"
site_theme: "default"

title: "Shuyu Zhang"
title_separator: "-"
name: &name "Shuyu Zhang"
description: &description "High-performance power delivery for AI infrastructure"

url: "https://mocchi-chan.github.io"
baseurl: ""
repository: "mocchi-chan/mocchi-chan.github.io"


# Author profile
author:
  avatar: "profile.png"
  name: "Shuyu Zhang"
  pronouns: "she/her"
  bio: "Ph.D. Student in EECS"
  location: "Berkeley, CA"
  employer: "UC Berkeley"
  email: "shuyu-zhang@berkeley.edu"

  googlescholar: "https://scholar.google.com/citations?user=rHK_wkAAAAAJ"
  linkedin: "shuyu-zhang-792aa2428"


# Publication categories
publication_category:
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"
  patents:
    title: "Patent Applications"


# Site settings
teaser:
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

comments:
  provider: false

atom_feed:
  hide: true
  path:


# SEO
google_site_verification:
bing_site_verification:
alexa_site_verification:
yandex_site_verification:

og_image:
og_description: "High-performance power delivery for AI infrastructure"

social:
  type: "Person"
  name: "Shuyu Zhang"
  links:
    - "https://scholar.google.com/citations?user=rHK_wkAAAAAJ"
    - "https://www.linkedin.com/in/shuyu-zhang-792aa2428/"


# Analytics
analytics:
  provider: false
  google:
    tracking_id:


# Files included in the site
include:
  - .htaccess
  - _pages
  - files

exclude:
  - files/papers/README.md
  - AGENTS.md
  - README.md
  - scripts
  - markdown_generator
  - talkmap.py
  - talkmap
  - talkmap.ipynb
  - talkmap_out.ipynb
  - docker-compose.yaml
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Markdown conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/

  publications:
    output: true
    permalink: /:collection/:path/

  portfolio:
    output: true
    permalink: /:collection/:path/

  talks:
    output: true
    permalink: /:collection/:path/


# Default layouts
defaults:
  # Blog posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false

  # Standalone pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  # Teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # Publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # Gallery items
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # Talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# URLs and time
permalink: /:categories/:title/
timezone: America/Los_Angeles


# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# Archives
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/


# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
